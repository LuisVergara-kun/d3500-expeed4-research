<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Nikon D3500 EXPEED 4 — Firmware Research. Nine pro features unlocked, confirmed on real hardware.">
